---
- name: Get Kubernetes version
  ansible.builtin.set_fact:
    kubernetes_version: "v1.37.0"


- name: Set kubectl architecture
  ansible.builtin.set_fact:
    kubectl_arch: >-
      {{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}


- name: Download kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubernetes_version }}/bin/linux/{{ kubectl_arch }}/kubectl"
    dest: /tmp/kubectl
    mode: "0755"


- name: Download kubectl checksum
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubernetes_version }}/bin/linux/{{ kubectl_arch }}/kubectl.sha256"
    dest: /tmp/kubectl.sha256
    mode: "0644"


- name: Verify kubectl checksum
  ansible.builtin.shell:
    cmd: |
      cd /tmp
      echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
  register: kubectl_checksum
  changed_when: false


- name: Display checksum result
  ansible.builtin.debug:
    var: kubectl_checksum.stdout


- name: Install kubectl
  ansible.builtin.copy:
    src: /tmp/kubectl
    dest: /usr/local/bin/kubectl
    remote_src: true
    owner: root
    group: root
    mode: "0755"


- name: Check kubectl client version
  ansible.builtin.command:
    cmd: kubectl version --client
  register: kubectl_client_version
  changed_when: false


- name: Display kubectl version
  ansible.builtin.debug:
    var: kubectl_client_version.stdout
